apiVersion: apps/v1
kind: Deployment
metadata:
  name: kss-common-service
  namespace: kss-common-service
  labels:
    app: kss-common-service
    version: v1.0.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Keep the running pod until the new one is Ready (one replica, so maxSurge brings it up first).
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: kss-common-service
  template:
    metadata:
      labels:
        app: kss-common-service
        version: v1.0.0
    spec:
      imagePullSecrets:
      - name: docker-secret
      containers:
      - name: kss-common-service
        image: docker-hosted.sebaoffice.ir/kss-common-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8000"
        - name: TZ
          value: "UTC"
        - name: Logging__LogLevel__Default
          value: "Information"
        - name: Logging__LogLevel__Microsoft.AspNetCore
          value: "Warning"
        # Secrets come from Kubernetes Secrets in this namespace; nothing secret is baked into the image.
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: common-service-db-connection
              key: connectionString
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: common-service-jwt
              key: jwtSecret
        # Values the image no longer carries in a settings file.
        - name: PORT
          value: "8000"
        - name: ALLOWED_ORIGINS
          value: "http://localhost:3000,https://erp.seba.ir,https://members.sebaoffice.ir,https://common.api.sebaoffice.ir"
        - name: Authentication__Type
          value: "JwtBearer"
        # Current terms version per application. Enable it together with that application's terms text:
        # until the two agree, the application shows the form and accepts are refused. While absent, the
        # application is not enabled (its requests return 404). A value must be 1-32 characters with no
        # surrounding whitespace, or the service refuses to start.
        # - name: Terms__CurrentVersion__customerrisk
        #   value: "<the CRS zone's terms version constant>"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kss-common-service-service
  namespace: kss-common-service
  labels:
    app: kss-common-service
  annotations:
    haproxy.org/cookie-persistence: "common-session"
spec:
  selector:
    app: kss-common-service
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
  sessionAffinity: None
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kss-common-service-ingress
  namespace: kss-common-service
  annotations:
    haproxy.org/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    acme.cert-manager.io/http01-edit-in-place: "true"

    kubernetes.io/ingress.class: haproxy
    haproxy.org/cookie-persistence: "common-session"
    haproxy.org/timeout-client: "10h"
    haproxy.org/timeout-server: "10h"

spec:
  ingressClassName: haproxy
  tls:
  - hosts:
    - common.api.sebaoffice.ir
    secretName: kss-common-service-tls
  rules:
  - host: common.api.sebaoffice.ir
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kss-common-service-service
            port:
              number: 80
